services:
  - type: web
    name: shop-starter
    runtime: python
    plan: free
    buildCommand: |
      pip install -r requirements.txt
      python manage.py collectstatic --noinput
      python manage.py migrate
    startCommand: gunicorn config.wsgi:application --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: DEBUG
        value: "False"
      - key: CONN_MAX_AGE
        value: "600"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: shop-starter.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://tu-frontend.vercel.app
      - key: CSRF_TRUSTED_ORIGINS
        value: https://tu-frontend.vercel.app
      - key: DATABASE_URL
        fromDatabase:
          name: shop-starter-db
          property: connectionString

databases:
  - name: shop-starter-db
    databaseName: shopstarter
    user: shopstarter