components:
  schemas:
    ActionTypeEnum:
      enum:
      - CREATE
      - UPDATE
      - DELETE
      - SOFT_DELETE
      - RESTORE
      - STATUS_CHANGE
      - ROLE_CHANGE
      - LOGIN
      - LOGOUT
      - REFRESH
      - UNKNOWN
      type: string
      description: |-
        * `CREATE` - Create
        * `UPDATE` - Update
        * `DELETE` - Delete
        * `SOFT_DELETE` - Soft Delete
        * `RESTORE` - Restore
        * `STATUS_CHANGE` - Status Change
        * `ROLE_CHANGE` - Role Change
        * `LOGIN` - Login
        * `LOGOUT` - Logout
        * `REFRESH` - Refresh
        * `UNKNOWN` - Unknown
    AuditLog:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        user:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        action_type:
          allOf:
          - $ref: '#/components/schemas/ActionTypeEnum'
          readOnly: true
        source:
          allOf:
          - $ref: '#/components/schemas/SourceEnum'
          readOnly: true
        content_type:
          type: integer
          readOnly: true
          nullable: true
        object_id:
          type: string
          readOnly: true
          nullable: true
        object_repr:
          type: string
          readOnly: true
        previous_data:
          readOnly: true
          nullable: true
        new_data:
          readOnly: true
          nullable: true
        ip_address:
          type: string
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - action_type
      - content_type
      - created_at
      - id
      - ip_address
      - new_data
      - object_id
      - object_repr
      - previous_data
      - source
      - updated_at
      - user
    Category:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 120
        description:
          type: string
          nullable: true
        emoji:
          type: string
          nullable: true
          maxLength: 20
        is_active:
          type: boolean
      required:
      - id
      - name
    CrePro:
      type: object
      description: Serializer para CREAR/EDITAR productos (el vendedor envía datos).
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        vendor:
          type: string
          format: uuid
          readOnly: true
        category:
          type: integer
          nullable: true
        category_name:
          type: string
          readOnly: true
        name:
          type: string
          maxLength: 255
        description:
          type: string
        ai_description:
          type: string
          nullable: true
        price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        stock:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        status:
          $ref: '#/components/schemas/Status308Enum'
        rejection_reason:
          type: string
          nullable: true
        is_featured:
          type: boolean
        images:
          type: array
          items:
            $ref: '#/components/schemas/PImageWrite'
        is_deleted:
          type: boolean
      required:
      - category_name
      - description
      - id
      - name
      - price
      - vendor
    Image:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        url_image:
          type: string
          format: uri
        is_main:
          type: boolean
      required:
      - id
      - url_image
    Location:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        user:
          type: string
          format: uuid
        user_name:
          type: string
          readOnly: true
        user_email:
          type: string
          format: email
          readOnly: true
        user_status:
          type: string
          readOnly: true
        latitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,18})?$
        longitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,18})?$
        description:
          type: string
          nullable: true
          maxLength: 255
        images:
          type: array
          items:
            $ref: '#/components/schemas/Image'
        products:
          type: string
          readOnly: true
        is_active:
          type: boolean
