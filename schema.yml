  /api/auth/register/:
    post:
      operationId: api_auth_register_create
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Register'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Register'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Register'
        required: true
      security:
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Register'
          description: ''
  /api/auth/token/refresh/:
    post:
      operationId: api_auth_token_refresh_create
      description: |-
        VISTA DE REFRESCO (ORQUESTADOR):
        Permite obtener un nuevo Access Token usando el Refresh Token de la cookie.
      tags:
      - api
      security:
      - {}
      responses:
        '200':
          description: No response body
  /api/chat/assistant/:
    post:
      operationId: api_chat_assistant_create
      description: |-
        Controlador para el Chat de Asistencia de Compras.
        Acepta 'message' (texto), 'image' (archivo o URL), 'product_id' (para caché de visión).
      tags:
      - api
      security:
      - {}
      responses:
        '200':
          description: No response body
