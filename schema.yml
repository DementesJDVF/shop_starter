components:
  schemas:
    ActionTypeEnum:
      enum:
      - CREATE
      - UPDATE
      - DELETE
      - SOFT_DELETE
      - RESTORE
      - STATUS_CHANGE
      - ROLE_CHANGE
      - LOGIN
      - LOGOUT
      - REFRESH
      - UNKNOWN
    CouponTypeEnum:
      enum:
      - PERCENTAGE
      - FIXED_AMOUNT
      - BUY_ONE_GET_ONE
      - FREE_SHIPPING
      - FLASH_SALE
    CouponStatusEnum:
      enum:
      - ACTIVE
      - EXPIRED
      - DISABLED
      - DRAFT
    CouponWithProducts:
      type: object
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        code:
          type: string
          maxLength: 50
          description: 'Código de cupón. Entre 1 y 50 caracteres. Alfanuméricos, guiones
            bajos.'
          example: SUMMER25
          minLength: 1
          pattern: '^[A-Za-z0-9_]+$'
        discount_type:
          $ref: '#/components/schemas/CouponTypeEnum'
        discount_value:
          type: number
          description: 'Valor del descuento. Si es PERCENTAGE, debe ser entre 1 y 100.
            Si es FIXED_AMOUNT, debe ser positivo.'
          format: double
          minimum: 1
          maximum: 100
        min_order_amount:
          type: number
          description: 'Monto mínimo de compra para aplicar el cupón. Mínimo 0.'
          format: double
          minimum: 0
        max_uses:
          type: integer
          description: 'Máximo de usos del cupón. 0 para uso ilimitado.'
          format: int64
          minimum: 0
        used_count:
          type: integer
          description: 'Número de veces que se ha usado el cupón.'
          format: int64
          readOnly: true
        status:
          $ref: '#/components/schemas/CouponStatusEnum'
        valid_from:
          type: string
          description: 'Fecha de inicio de validez del cupón. Formato ISO 8601.'
          format: date-time
        valid_to:
          type: string
          description: 'Fecha de fin de validez del cupón. Formato ISO 8601.'
          format: date-time
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - code
      - discount_type
      - discount_value
      - min_order_amount
    CreateCoupon:
      type: object
      properties:
        code:
          type: string
          maxLength: 50
          description: 'Código de cupón. Entre 1 y 50 caracteres. Alfanuméricos, guiones
            bajos.'
          example: SUMMER25
          minLength: 1
          pattern: '^[A-Za-z0-9_]+$'
        discount_type:
          $ref: '#/components/schemas/CouponTypeEnum'
        discount_value:
          type: number
          description: 'Valor del descuento. Si es PERCENTAGE, debe ser entre 1 y 100.
            Si es FIXED_AMOUNT, debe ser positivo.'
          format: double
          minimum: 1
          maximum: 100
        min_order_amount:
          type: number
          description: 'Monto mínimo de compra para aplicar el cupón. Mínimo 0.'
          format: double
          minimum: 0
        max_uses:
          type: integer
          description: 'Máximo de usos del cupón. 0 para uso ilimitado.'
          format: int64
          minimum: 0
        status:
          $ref: '#/components/schemas/CouponStatusEnum'
        valid_from:
          type: string
          description: 'Fecha de inicio de validez del cupón. Formato ISO 8601.'
          format: date-time
        valid_to:
          type: string
          description: 'Fecha de fin de validez del cupón. Formato ISO 8601.'
          format: date-time
      required:
      - code
      - discount_type
      - discount_value
      - min_order_amount
    PatchedCoupon:
      type: object
      properties:
        code:
          type: string
          maxLength: 50
          description: 'Código de cupón. Entre 1 y 50 caracteres. Alfanuméricos, guiones
            bajos.'
          example: SUMMER25
          minLength: 1
          pattern: '^[A-Za-z0-9_]+$'
        discount_type:
          $ref: '#/components/schemas/CouponTypeEnum'
        discount_value:
          type: number
          description: 'Valor del descuento. Si es PERCENTAGE, debe ser entre 1 y 100.
            Si es FIXED_AMOUNT, debe ser positivo.'
          format: double
          minimum: 1
          maximum: 100
        min_order_amount:
          type: number
          description: 'Monto mínimo de compra para aplicar el cupón. Mínimo 0.'
          format: double
          minimum: 0
        status:
