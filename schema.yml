openapi: 3.0.3
info:
  title: SHOPSTARTER API
  version: 1.0.0
  description: Documentación de la API del proyecto SHOPSTARTER
paths:
  /api/audit/logs/:
    get:
      operationId: api_audit_logs_list
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - api
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAuditLogList'
          description: ''
  /api/audit/logs/{id}/:
    get:
      operationId: api_audit_logs_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this audit log.
        required: true
      tags:
      - api
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLog'
          description: ''
  /api/auth/csrf/:
    get:
      operationId: api_auth_csrf_retrieve
      description: |-
        VISTA CSRF:
        Provee el token CSRF necesario para el frontend en peticiones seguras.
      tags:
      - api
      security:
      - {}
      responses:
        '200':
          description: No response body
  /api/auth/login/:
    post:
      operationId: api_auth_login_create
      description: |-
        VISTA DE LOGIN (ORQUESTADOR):
        Se encarga de recibir la petición, delegar la lógica al AuthService y
        configurar las cookies seguras en la respuesta.
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Login'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Login'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Login'
          description: ''
  /api/auth/logout/:
    post:
      operationId: api_auth_logout_create
      description: |-
        VISTA DE LOGOUT ROBUSTA E IDEMPOTENTE:
        Garantiza el cierre de sesión sin errores 401, incluso si el access_token ha expirado.
        Limpia cookies HttpOnly y busca invalidar la sesión en DB si hay un refresh_token válido.
      tags:
      - api
      security:
      - {}
      responses:
        '200':
          description: No response body
  /api/auth/me/:
    get:
      operationId: api_auth_me_retrieve
      tags:
      - api
      responses:
        '200':
          description: No response body
  /api/auth/password-reset/:
    post:
